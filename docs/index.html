<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Love Letter · 产品与支持</title>
  <meta name="description" content="Love Letter（爱的信件）：iPhone 书信式互动，自备 OpenRouter API 生成回信；数据主要在本机。">
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #555;
      --bg: #fafafa;
      --card: #fff;
      --border: #e0e0e0;
      --link: #0969da;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #f0f0f0;
        --muted: #aaa;
        --bg: #121212;
        --card: #1e1e1e;
        --border: #333;
        --link: #58a6ff;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", sans-serif;
      line-height: 1.6;
      color: var(--fg);
      background: var(--bg);
      margin: 0;
      padding: 1.25rem 1rem 2.5rem;
      max-width: 42rem;
      margin-left: auto;
      margin-right: auto;
    }
    header {
      margin-bottom: 1.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .lang-switch {
      display: flex;
      justify-content: flex-end;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
    }
    .lang-switch button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      padding: 0.3rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .lang-switch button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    h1 { font-size: 1.45rem; margin: 0 0 0.35rem; font-weight: 600; }
    .subtitle { color: var(--muted); font-size: 0.92rem; margin: 0; }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      margin-top: 0.65rem;
    }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.2rem;
      margin-bottom: 1rem;
    }
    h2 { font-size: 1.05rem; margin: 0 0 0.55rem; font-weight: 600; }
    h3 { font-size: 0.95rem; margin: 0.85rem 0 0.4rem; font-weight: 600; }
    h3:first-of-type { margin-top: 0; }
    p, ul { margin: 0.45rem 0; font-size: 0.92rem; }
    ul { padding-left: 1.15rem; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .muted { font-size: 0.85rem; color: var(--muted); margin: 0 0 0.75rem; }
    footer { margin-top: 1.5rem; font-size: 0.78rem; color: var(--muted); }
    code { font-size: 0.88em; }
  </style>
</head>
<body>
  <header>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="zh-Hans">中文</button>
      <button type="button" data-lang="en">English</button>
    </div>
    <h1 id="brand"></h1>
    <p class="subtitle" id="subtitle"></p>
    <span class="badge" id="badge"></span>
  </header>

  <section id="product"></section>
  <section id="features"></section>
  <section id="support"></section>
  <section id="privacy"></section>
  <section id="ai"></section>
  <section id="requirements"></section>
  <footer id="footer"></footer>

  <script>

          "On device: letters, status, unlock timing, profile—for display and management.",

        aiTitle: "AI & generated content",
        aiLead: "Replies come from <strong>large language models</strong>. Read before use.",

        aiNature: "Nature",
        aiNatureList: [
          "Not human-written or fact-checked; may be wrong, mismatched, or biased—use judgment; not facts or promises."
        ],

          "Not counseling, medical, legal, or crisis care—for emergencies contact local services immediately."
        ],
        aiYou: "Your responsibility",
        aiYouList: [

        reqTitle: "System & network",
        reqList: [
          "Network to <strong>openrouter.ai</strong> and a valid API key.",

    function ul(items) {
      const el = document.createElement("ul");
      items.forEach(t => {
        const li = document.createElement("li");
        li.innerHTML = t;
        el.appendChild(li);
      });
      return el;
    }

    function sectionBasic(id, title, paragraphs, list) {
      const root = document.getElementById(id);
      root.innerHTML = "";
      const h2 = document.createElement("h2");
      h2.textContent = title;
      root.appendChild(h2);
      paragraphs.forEach(html => {
        const p = document.createElement("p");
        p.innerHTML = html;
        root.appendChild(p);
      });
      if (list && list.length) root.appendChild(ul(list));
    }

    function sectionPrivacyLike(id, s) {
      const root = document.getElementById(id);
      root.innerHTML = "";
      const h2 = document.createElement("h2");
      h2.textContent = s.privacyTitle;
      root.appendChild(h2);
      const lead = document.createElement("p");
      lead.className = "muted";
      lead.innerHTML = s.privacyLead;
      root.appendChild(lead);

      [["pWhat", "pWhatList"], ["pUse", "pUseList"], ["pShare", "pShareList"], ["pKeep", "pKeepList"], ["pChoice", "pChoiceList"]].forEach(([hk, lk]) => {
        const h3 = document.createElement("h3");
        h3.textContent = s[hk];
        root.appendChild(h3);
        root.appendChild(ul(s[lk]));
      });
    }

    function sectionAI(id, s) {
      const root = document.getElementById(id);
      root.innerHTML = "";
      const h2 = document.createElement("h2");
      h2.textContent = s.aiTitle;
      root.appendChild(h2);
      const lead = document.createElement("p");
      lead.className = "muted";
      lead.innerHTML = s.aiLead;
      root.appendChild(lead);

      [["aiNature", "aiNatureList"], ["aiNot", "aiNotList"], ["aiYou", "aiYouList"]].forEach(([hk, lk]) => {
        const h3 = document.createElement("h3");
        h3.textContent = s[hk];
        root.appendChild(h3);
        root.appendChild(ul(s[lk]));
      });
    }

    function renderSupport(s) {
      const root = document.getElementById("support");
      root.innerHTML = "";
      const h2 = document.createElement("h2");
      h2.textContent = s.supportTitle;
      root.appendChild(h2);
      const p = document.createElement("p");
      p.innerHTML = s.supportIntro + " <a href=\"" + SUPPORT_URL + "\" rel=\"noopener noreferrer\">" + SUPPORT_URL + "</a>";
      root.appendChild(p);
      const note = document.createElement("p");
      note.className = "muted";
      note.textContent = s.supportNote;
      root.appendChild(note);
    }

    function renderFooter(s) {
      const root = document.getElementById("footer");
      root.innerHTML = "";
      const p1 = document.createElement("p");
      p1.textContent = s.footCopy;
      root.appendChild(p1);
      const p2 = document.createElement("p");
      p2.className = "muted";
      p2.style.marginTop = "0.5rem";
      p2.textContent = s.footNote;
      root.appendChild(p2);
    }

    function initLang() {
      const saved = localStorage.getItem("loveletter_lang");
      if (saved === "zh-Hans" || saved === "en") return saved;
      const n = (navigator.language || "").toLowerCase();
      return n.startsWith("zh") ? "zh-Hans" : "en";
    }

    function apply(lang) {
      const s = STR[lang];
      document.documentElement.lang = lang;
      document.title = s.metaTitle;
      const m = document.querySelector('meta[name="description"]');
      if (m) m.setAttribute("content", s.metaDesc);

      document.getElementById("brand").textContent = s.brand;
      document.getElementById("subtitle").textContent = s.subtitle;
      document.getElementById("badge").textContent = s.badge;

      document.querySelectorAll("[data-lang]").forEach(btn => {
        const is = btn.getAttribute("data-lang") === lang;
        btn.classList.toggle("active", is);
        btn.textContent = btn.getAttribute("data-lang") === "zh-Hans" ? s.btnZh : s.btnEn;
      });

      sectionBasic("product", s.productTitle, s.productP, null);
      sectionBasic("features", s.featuresTitle, [], s.featuresList);
      renderSupport(s);
      sectionPrivacyLike("privacy", s);
      sectionAI("ai", s);
      sectionBasic("requirements", s.reqTitle, [], s.reqList);
      renderFooter(s);

      localStorage.setItem("loveletter_lang", lang);
    }

    document.querySelectorAll("[data-lang]").forEach(btn => {
      btn.addEventListener("click", () => apply(btn.getAttribute("data-lang")));
    });

    apply(initLang());
  </script>
</body>
</html>
