    function resolveInitialLang() {
      const saved = localStorage.getItem("loveletter_lang");
      if (saved === "zh-Hans" || saved === "en") return saved;
      const nav = (navigator.language || "").toLowerCase();
      return nav.startsWith("zh") ? "zh-Hans" : "en";
    }

    function renderList(items) {
      const ul = document.createElement("ul");
      items.forEach(item => {
        const li = document.createElement("li");
        li.innerHTML = item;
        ul.appendChild(li);
      });
      return ul;
    }

    function clearNode(node) {
      while (node.firstChild) node.removeChild(node.firstChild);
    }

    function renderSectionBasic(targetId, sectionData, withList = false) {
      const root = document.getElementById(targetId);
      clearNode(root);

      const h2 = document.createElement("h2");
      h2.textContent = sectionData.title;
      root.appendChild(h2);

      if (sectionData.paragraphs) {
        sectionData.paragraphs.forEach(p => {
          const el = document.createElement("p");
          el.innerHTML = p;
          root.appendChild(el);
        });
      }

      if (withList && sectionData.items) {
        root.appendChild(renderList(sectionData.items));
      }
    }

    function renderSupport(data) {
      const root = document.getElementById("support");
      clearNode(root);

      const h2 = document.createElement("h2");
      h2.textContent = data.title;
      root.appendChild(h2);

      const p1 = document.createElement("p");
      p1.textContent = data.line1;
      root.appendChild(p1);

      const p2 = document.createElement("p");
      const a = document.createElement("a");
      a.href = data.repo;
      a.textContent = data.repo;
      p2.appendChild(a);
      root.appendChild(p2);
    }

    function renderBlocksSection(targetId, data, leadClassName) {
      const root = document.getElementById(targetId);
      clearNode(root);

      const h2 = document.createElement("h2");
      h2.textContent = data.title;
      root.appendChild(h2);

      const lead = document.createElement("p");
      lead.className = leadClassName;
      lead.innerHTML = data.lead;
      root.appendChild(lead);

      data.blocks.forEach(block => {
        const h3 = document.createElement("h3");
        h3.textContent = block.h3;
        root.appendChild(h3);
        root.appendChild(renderList(block.items));
      });
    }

    function renderFooter(data) {
      const root = document.getElementById("footer");
      clearNode(root);

      const p1 = document.createElement("p");
      p1.textContent = data.copyright;
      root.appendChild(p1);

      const p2 = document.createElement("p");
      p2.className = "disclaimer-lead";
      p2.style.marginTop = "0.75rem";
      p2.innerHTML = data.note;
      root.appendChild(p2);
    }

    function applyLang(lang) {
      const dict = i18n[lang] || i18n["zh-Hans"];

      document.documentElement.lang = lang;
      document.title = dict.meta.title;
      const desc = document.querySelector('meta[name="description"]');
      if (desc) desc.setAttribute("content", dict.meta.description);

      document.getElementById("brand").textContent = dict.header.brand;
      document.getElementById("subtitle").textContent = dict.header.subtitle;
      document.getElementById("badge").textContent = dict.header.badge;

      const zhBtn = document.querySelector('[data-lang-btn="zh-Hans"]');
      const enBtn = document.querySelector('[data-lang-btn="en"]');
      zhBtn.textContent = dict.header.langZh;
      enBtn.textContent = dict.header.langEn;

      document.querySelectorAll("[data-lang-btn]").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-lang-btn") === lang);
      });

      renderSectionBasic("product", dict.product, false);
      renderSectionBasic("features", dict.features, true);
      renderSupport(dict.support);
      renderBlocksSection("privacy", dict.privacy, "disclaimer-lead");
      renderBlocksSection("ai", dict.ai, "disclaimer-lead");
      renderSectionBasic("requirements", dict.requirements, true);
      renderFooter(dict.footer);

      localStorage.setItem("loveletter_lang", lang);
    }

    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-lang-btn]");
      if (!btn) return;
      applyLang(btn.getAttribute("data-lang-btn"));
    });

    applyLang(resolveInitialLang());
  </script>
</body>
</html>
